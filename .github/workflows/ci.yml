name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Config Java 21
        uses: actions/setup-java@v4
        with:
         java-version: '21'
         distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
         path: ~/.m2
         key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build Tests
        run: mvn clean test

      - name: Build
        run: mvn package -DskipTests